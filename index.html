
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Manju | AI Webtoon Adapter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #1E1E1E; /* macOS Dark Mode Background */
        color: #E5E5E5;
        overflow: hidden; /* Prevent body scroll */
        height: 100vh;
        width: 100vw;
      }
      
      #root {
        height: 100%;
        width: 100%;
      }

      /* Global Mac-like Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      ::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
      
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.3);
      }

      /* Utility class for containers that must scroll */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      }

      /* === Parallel Script Generation Animations === */
      
      /* Pulsing border glow for generating episodes */
      @keyframes pulse-border {
        0%, 100% { 
          border-color: rgba(59, 130, 246, 0.3); 
          box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); 
        }
        50% { 
          border-color: rgba(59, 130, 246, 0.8); 
          box-shadow: 0 0 20px 2px rgba(59, 130, 246, 0.3); 
        }
      }

      /* Gradient flow animation for background */
      @keyframes gradient-flow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Progress bar sliding animation */
      @keyframes progress-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      /* Slow spin for loading icon */
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Breathing/pulsing background */
      @keyframes breathe {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }

      .animate-pulse-border {
        animation: pulse-border 2s ease-in-out infinite;
      }

      .animate-gradient-flow {
        background-size: 200% 200%;
        animation: gradient-flow 3s ease infinite;
      }

      .animate-progress-slide {
        animation: progress-slide 1.5s ease-in-out infinite;
      }

      .animate-spin-slow {
        animation: spin-slow 2s linear infinite;
      }

      .animate-breathe {
        animation: breathe 2s ease-in-out infinite;
      }

      /* Infinite progress bar (existing, ensure it's here) */
      @keyframes progress-infinite {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
      
      .animate-progress-infinite {
        animation: progress-infinite 1.5s ease-in-out infinite;
      }
    </style>
